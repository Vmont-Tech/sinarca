version: "3.9"

services:
sinarca:
container_name: sinarca

```
build:
  context: .
  dockerfile: Dockerfile

restart: always

ports:
  - "80:80"
  - "5680:5680"
  - "5432:5432"

env_file:
  - .env

environment:
  DATABASE_URL: postgresql://sinarca:sinarca123@localhost:5432/sinarca_db
  POSTGRES_DB: sinarca_db
  POSTGRES_USER: sinarca
  POSTGRES_PASSWORD: sinarca123

volumes:
  - postgres_data:/var/lib/postgresql
  - uploads_data:/app/uploads

healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:5680/docs"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s
```

volumes:
postgres_data:
uploads_data:

