[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinarcaapi"
version = "0.1.0"
description = "API MVP do SINARCA para alimentar o frontend React/Vite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.7.0",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "backend_app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
